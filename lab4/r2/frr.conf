frr version 10.6.2
frr defaults traditional
hostname r2
!
interface eth1
 description link-to-r1-vlan10
 ip address 10.1.2.2/24
 no shutdown
!
interface eth2
 description link-to-r3-vlan20
 ip address 10.1.3.2/24
 no shutdown
!
interface lo
 ip address 10.0.1.2/32
!
router ospf
 ospf router-id 2.2.1.1
 network 10.1.2.0/24 area 0
 network 10.1.3.0/24 area 0
!
