frr version 10.6.2
frr defaults traditional
hostname r3
!
interface eth1
 description link-to-r2
 ip address 10.0.23.2/24
 no shutdown
!
interface eth2
 description link-to-r1
 ip address 10.0.13.1/24
 no shutdown
!
interface lo
 ip address 10.0.1.3/32
!
ip route 10.0.1.1/32 10.0.13.2
ip route 10.0.1.2/32 10.0.23.1
!
