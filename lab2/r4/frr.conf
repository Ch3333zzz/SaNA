frr version 10.6.2
frr defaults traditional
hostname r4
!
interface eth1
 description link-to-r2
 ip address 10.0.24.2/24
 no shutdown
!
interface eth3
 description link-to-r5
 ip address 10.0.45.2/24
 no shutdown
!
interface lo
 ip address 10.0.1.4/32
!
ip route 10.0.1.2/32 10.0.24.1
ip route 10.0.1.5/32 10.0.45.1
!

