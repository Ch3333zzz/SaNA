frr version 10.6.2
frr defaults traditional
hostname r2
!
interface eth1
 description link-to-r1
 ip address 10.0.12.2/24
 shutdown
!
interface eth2
 description link-to-r3
 ip address 10.0.23.1/24
 no shutdown
!
interface eth3
 description link-to-r4
 ip address 10.0.24.1/24
 no shutdown
!
interface lo
 ip address 10.0.1.2/32
!
ip route 10.0.1.1/32 10.0.12.1 eth1
ip route 10.0.1.3/32 10.0.23.2
ip route 10.0.1.4/32 10.0.24.2
ip route 10.0.1.1/32 10.0.23.2 100
!
