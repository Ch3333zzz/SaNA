frr version 10.6.2
frr defaults traditional
hostname r5
!
interface eth1
 description link-to-r1
 ip address 10.0.15.1/24
 no shutdown
!
interface eth2
 description link-to-r4
 ip address 10.0.45.1/24
 no shutdown
!
interface eth3
 description link-to-r6
 ip address 10.0.56.1/24
 no shutdown
!
interface lo
 ip address 10.0.1.5/32
!
ip route 10.0.1.1/32 10.0.15.2
ip route 10.0.1.4/32 10.0.45.2
ip route 10.0.1.6/32 10.0.56.2
!
