frr version 10.6.2
frr defaults traditional
hostname r1
!
interface eth1
 description link-to-r2
 ip address 10.0.12.1/24
 shutdown
!
interface eth2
 description link-to-r3
 ip address 10.0.13.2/24
 no shutdown
!
interface eth3
 description link-to-r5
 ip address 10.0.15.2/24
 no shutdown
!
interface lo
 ip address 10.0.1.1/32
!
ip route 10.0.1.2/32 10.0.12.2 eth1
ip route 10.0.1.3/32 10.0.13.1
ip route 10.0.1.5/32 10.0.15.1
ip route 10.0.1.2/32 10.0.13.1 100
!
